name: CI — AppSalon PHP MVC

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
      - "claude/**"
  pull_request:
    branches:
      - main
      - "feature/**"

jobs:
  tests:
    name: PHP 8.2 + MySQL 8.0 (Migraciones, Frontend, Linter, PHPUnit y Backup/Restore)
    runs-on: ubuntu-latest
    # Tope del job: ~1,9 veces la corrida más larga observada (95 min el 2026-10-23; 76-95 min en las corridas verdes de ese día).
    # Antes el único tope era el de 6 h de GitHub: el run 409 de #48 estuvo 4 h en PHPUnit sin avanzar.
    timeout-minutes: 180

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: appsalon_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

    env:
      APP_ENV: testing
      APP_URL: http://localhost:3000
      APP_TIMEZONE: America/Guayaquil
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: root
      DB_NAME: appsalon_ci_test
      PAYMENT_WEBHOOK_SECRET: ci_test_webhook_secret_hmac_2026

    steps:
      - name: Checkout del repositorio
        timeout-minutes: 5
        uses: actions/checkout@v4

      - name: Configurar PHP 8.2
        timeout-minutes: 5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, pdo_mysql, mbstring, zlib, gd, fileinfo, sodium, curl, pcntl, posix
          ini-values: variables_order=EGPCS
          coverage: none

      - name: Configurar Node.js 24
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependencias de Composer
        # Observado: 3-6 s.
        timeout-minutes: 10
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Instalar dependencias de NPM y compilar frontend
        # Observado: 5-7 s.
        timeout-minutes: 10
        run: |
          npm ci
          npm run build
          node tests/ui_client_failure_test.js

      - name: Verificar sintaxis PHP (php -l)
        # Observado: 20-30 s.
        timeout-minutes: 5
        run: |
          find Router.php classes controllers database includes interfaces models public repositories scripts services tests views -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Cargar esquema base y aplicar todas las migraciones incrementales
        # Observado: 3-5 s.
        timeout-minutes: 10
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot appsalon_ci_test < database/schema_base.sql
          php database/migrador.php up
          php database/migrador.php status

      - name: Instalador idempotente del primer propietario (base nueva aislada)
        # Observado: 4-6 s.
        timeout-minutes: 5
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "CREATE DATABASE appsalon_ci_install_test CHARACTER SET utf8mb4"
          export DB_NAME=appsalon_ci_install_test OWNER_EMAIL=propietario@ci.test APP_URL=http://localhost:3000
          php scripts/instalar.php | tee /tmp/instalar1.log
          grep -q "ENLACE DE ACTIVACIÓN" /tmp/instalar1.log
          php scripts/instalar.php | tee /tmp/instalar2.log
          grep -q "activación de propietario pendiente" /tmp/instalar2.log
          test "$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -e 'SELECT COUNT(*) FROM appsalon_ci_install_test.colaboradores')" = "1"
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "DROP DATABASE appsalon_ci_install_test"

      # Detectar regresiones de navegador antes de las suites largas, sin omitir comprobaciones.
      - name: Construir y verificar imagen Docker oficial (Apache + PHP 8.2 + mbstring)
        # Observado: 1,5 min.
        timeout-minutes: 15
        run: |
          docker build -t appsalon-web-ci .
          docker run --rm appsalon-web-ci php -m | grep -i mbstring
          docker run --rm appsalon-web-ci php -m | grep -i mysqli
          docker run --rm appsalon-web-ci php -m | grep -i gd
          docker run --rm appsalon-web-ci php -m | grep -i sodium
          docker run --rm appsalon-web-ci apache2ctl -M | grep rewrite_module

      - name: Recorrido E2E aislado en Apache, MySQL y SMTP mock
        # Observado: 5-7,5 min.
        timeout-minutes: 20
        env:
          E2E_WEB_IMAGE: appsalon-web-ci
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/appsalon-e2e
        run: bash tests/run_browser_e2e.sh

      - name: Conservar resultados y registros E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apache-browser-e2e
          path: ${{ runner.temp }}/appsalon-e2e
          if-no-files-found: ignore

      - name: Ejecutar suite completa de PHPUnit (sin caché y orden aleatorio)
        # Observado: 33-38 min. El límite es ~2 veces eso (4500 s) y lo aplica scripts/ci_con_limite.sh: si se supera, captura procesos y consultas/bloqueos
        # de MySQL MIENTRAS la suite sigue viva y recién después la termina (el ejecutor, al agotar el tiempo del paso, mata el árbol sin dejar ver nada).
        # El registro de eventos (prueba a prueba) deja ver la última prueba iniciada. timeout-minutes es solo la red de seguridad.
        timeout-minutes: 80
        run: bash scripts/ci_con_limite.sh 4500 php -d variables_order=EGPCS vendor/bin/phpunit --do-not-cache-result --order-by=random --colors=never --log-teamcity "$RUNNER_TEMP/phpunit-eventos.txt"

      - name: Conservar registro de eventos de PHPUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-eventos
          path: ${{ runner.temp }}/phpunit-eventos.txt
          if-no-files-found: ignore

      # La validación independiente de los XLSX exportados (ronda 5) usa dos lectores ajenos a nuestro escritor: openpyxl y LibreOffice.
      - name: Instalar lectores independientes de XLSX (openpyxl y LibreOffice Calc)
        # Observado: 22 s a 12 min (apt-get update e instalación dependen de la red).
        timeout-minutes: 25
        run: |
          # Instalación del sistema: el QA lanza python3 con un entorno mínimo (sin HOME) y no vería el sitio de usuario.
          sudo python3 -m pip install --break-system-packages 'openpyxl==3.1.5'
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc
          python3 -c "import openpyxl; print('openpyxl', openpyxl.__version__)"
          soffice --version

      - name: QA independiente (tests/Qa) en base MySQL aislada — obligatorio
        # Incluye las pruebas de concurrencia con procesos reales (DEF-02, DEF-06), HTTP real, correo, esquema y navegador.
        # Observado: 33-37 min. Límite ~2 veces eso (4500 s, scripts/ci_con_limite.sh: captura el estado antes de terminar la suite); el registro de eventos
        # permite ver la última prueba iniciada. timeout-minutes es solo la red de seguridad.
        timeout-minutes: 80
        # El arnés (tests/Qa/QaCase.php) aborta si DB_NAME no cumple appsalon_qa_*_test; nunca toca appsalon_ci_test.
        env:
          DB_NAME: appsalon_qa_test
          EMAIL_HOST: 127.0.0.1
          EMAIL_PORT: "2599"
          EMAIL_USER: qa
          EMAIL_PASSWORD: qa
          CHROME_BIN: /usr/bin/google-chrome
          QA_EXIGIR_NAVEGADOR: "1"
          GESTION_CAPTURAS: ${{ runner.temp }}/gestion-capturas
        run: |
          export MYSQL_PWD=root
          mysql -h 127.0.0.1 -P 3306 -uroot -e "CREATE DATABASE appsalon_qa_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          mysql -h 127.0.0.1 -P 3306 -uroot appsalon_qa_test < database/schema_base.sql
          php database/migrador.php up
          test -x "$CHROME_BIN"
          bash scripts/ci_con_limite.sh 4500 php -d variables_order=EGPCS vendor/bin/phpunit --do-not-cache-result --colors=never --log-junit "$RUNNER_TEMP/qa-junit.xml" --log-teamcity "$RUNNER_TEMP/qa-eventos.txt" tests/Qa
          php scripts/ci_verificar_omitidas.php "$RUNNER_TEMP/qa-junit.xml" .github/qa_omitidas_permitidas.txt

      - name: Conservar informe JUnit de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-junit
          path: ${{ runner.temp }}/qa-junit.xml
          if-no-files-found: ignore

      - name: Conservar registro de eventos de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-eventos
          path: ${{ runner.temp }}/qa-eventos.txt
          if-no-files-found: ignore

      - name: Conservar capturas de clientes y Recursos Humanos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gestion-personas-capturas
          path: ${{ runner.temp }}/gestion-capturas
          if-no-files-found: ignore

      - name: Verificar ciclo completo de respaldo y restauración con validación SHA-256
        # Observado: 6-8 s.
        timeout-minutes: 15
        run: |
          php scripts/backup_db.php --db=appsalon_ci_test --output=/tmp/appsalon_ci_backup.sql.gz --gzip
          test -f /tmp/appsalon_ci_backup.sql.gz.manifest.json
          BACKUP_HASH=$(sha256sum /tmp/appsalon_ci_backup.sql.gz | awk '{print $1}')
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS appsalon_ci_restore_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          php scripts/restore_db.php --db=appsalon_ci_restore_test --input=/tmp/appsalon_ci_backup.sql.gz --hash=$BACKUP_HASH
          rm -f /tmp/appsalon_ci_backup.sql.gz /tmp/appsalon_ci_backup.sql.gz.manifest.json

      # Solo informa. Cubre el fallo o la cancelación de cualquier paso (runner, MySQL, contenedores, OOM). Si lo que se pasó de tiempo fue PHPUnit o el QA,
      # el estado de la suite (procesos, consultas y bloqueos de MySQL) ya se capturó antes de terminarla, en el log de ese paso (scripts/ci_con_limite.sh).
      - name: Diagnóstico del entorno si el job falla o se cancela
        if: failure() || cancelled()
        continue-on-error: true
        timeout-minutes: 5
        run: bash scripts/ci_diagnostico.sh
