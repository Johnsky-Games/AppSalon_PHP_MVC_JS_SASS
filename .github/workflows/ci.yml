name: CI — AppSalon PHP MVC

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feature/**"

jobs:
  tests:
    name: PHP 8.2 + MySQL 8.0 (Migraciones, Frontend, Linter, PHPUnit y Backup/Restore)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: appsalon_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

    env:
      APP_ENV: testing
      APP_URL: http://localhost:3000
      APP_TIMEZONE: America/Guayaquil
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: root
      DB_NAME: appsalon_ci_test
      PAYMENT_WEBHOOK_SECRET: ci_test_webhook_secret_hmac_2026

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, pdo_mysql, mbstring, zlib
          ini-values: variables_order=EGPCS
          coverage: none

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Instalar dependencias de Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Instalar dependencias de NPM y compilar frontend
        run: |
          npm ci
          npm run build

      - name: Verificar sintaxis PHP (php -l)
        run: |
          find Router.php classes controllers database includes interfaces models public repositories scripts services tests views -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Cargar esquema base y aplicar migraciones incrementales (001 a 009)
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot appsalon_ci_test < database/schema_base.sql
          php database/migrador.php up
          php database/migrador.php status

      - name: Construir y verificar imagen Docker oficial (Apache + PHP 8.2 + mbstring)
        run: |
          docker build -t appsalon-web-ci .
          docker run --rm appsalon-web-ci php -m | grep -i mbstring
          docker run --rm appsalon-web-ci php -m | grep -i mysqli
          docker run --rm appsalon-web-ci apache2ctl -M | grep rewrite_module

      - name: Iniciar contenedor Apache oficial y ejecutar suite E2E en navegador
        run: |
          # Sembrar administrador, cliente y catálogo inicial para el recorrido E2E
          PASS_HASH='$2y$10$5fbKwtKYcyFUSgV5wgWyMuvoxmR97oZYrvbEScIEWoqMNRZMaSp8q'
          mysql -h 127.0.0.1 -P 3306 -uroot -proot appsalon_ci_test <<EOSQL
          INSERT INTO servicios (id, nombre, precio) VALUES (1, 'Corte de Cabello Hombre', 80.00), (2, 'Corte de Cabello Mujer', 120.00), (3, 'Corte de Barba', 60.00) ON DUPLICATE KEY UPDATE nombre=VALUES(nombre);
          DELETE FROM usuarios WHERE email IN ('carlos@correo.com', 'admin@appsalon.com');
          INSERT INTO usuarios (id, nombre, apellido, email, password, telefono, admin, confirmado, token) VALUES (1, 'Carlos', 'Mendoza', 'carlos@correo.com', '${PASS_HASH}', '1234567890', 0, 1, NULL), (2, 'Admin', 'Salon', 'admin@appsalon.com', '${PASS_HASH}', '0987654321', 1, 1, NULL);
          DELETE FROM intentos_login;
          EOSQL

          # Iniciar contenedor Apache oficial conectado a la base MySQL
          docker run -d --name appsalon-web-ci-instance \
            -p 3000:80 \
            -v "$GITHUB_WORKSPACE:/var/www/html" \
            -e DB_HOST=172.17.0.1 \
            -e DB_PORT=3306 \
            -e DB_USER=root \
            -e DB_PASS=root \
            -e DB_NAME=appsalon_ci_test \
            -e APP_ENV=testing \
            -e APP_URL=http://localhost:3000 \
            -e PAYMENT_WEBHOOK_SECRET=ci_test_webhook_secret_hmac_2026 \
            appsalon-web-ci

          # Esperar readiness real del servidor web (polling con reintentos)
          echo "Esperando disponibilidad de http://localhost:3000/..."
          READY=0
          for i in {1..30}; do
            if curl -s -f -I http://localhost:3000/ > /dev/null 2>&1; then
              echo "Servidor Apache listo tras $i intentos."
              READY=1
              break
            fi
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "[ERROR] El servidor Apache no respondió a tiempo."
            docker logs appsalon-web-ci-instance
            docker stop appsalon-web-ci-instance && docker rm appsalon-web-ci-instance
            exit 1
          fi

          # Ejecutar suite E2E real en navegador headless (Chrome / Puppeteer)
          CHROME_BIN=$(which google-chrome || which chromium-browser || which chromium)
          echo "Ejecutando suite E2E con binario: $CHROME_BIN contra http://localhost:3000"
          CHROME_BIN=$CHROME_BIN APP_URL=http://localhost:3000 node tests/browser_e2e_test.js
          E2E_STATUS=$?

          if [ $E2E_STATUS -ne 0 ]; then
            echo "[ERROR] Suite E2E en navegador falló."
            docker logs appsalon-web-ci-instance
            docker stop appsalon-web-ci-instance && docker rm appsalon-web-ci-instance
            exit $E2E_STATUS
          fi

          echo "Suite E2E completada exitosamente."
          docker stop appsalon-web-ci-instance && docker rm appsalon-web-ci-instance

      - name: Ejecutar suite completa de PHPUnit (sin caché y orden aleatorio)
        run: php -d variables_order=EGPCS vendor/bin/phpunit --do-not-cache-result --order-by=random --colors=never

      - name: Verificar ciclo completo de respaldo y restauración con validación SHA-256
        run: |
          php scripts/backup_db.php --db=appsalon_ci_test --output=/tmp/appsalon_ci_backup.sql.gz --gzip
          test -f /tmp/appsalon_ci_backup.sql.gz.manifest.json
          BACKUP_HASH=$(sha256sum /tmp/appsalon_ci_backup.sql.gz | awk '{print $1}')
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS appsalon_ci_restore_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          php scripts/restore_db.php --db=appsalon_ci_restore_test --input=/tmp/appsalon_ci_backup.sql.gz --hash=$BACKUP_HASH
          rm -f /tmp/appsalon_ci_backup.sql.gz /tmp/appsalon_ci_backup.sql.gz.manifest.json
